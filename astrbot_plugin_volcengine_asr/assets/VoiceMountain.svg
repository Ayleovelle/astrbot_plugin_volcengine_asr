<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">火山引擎语音转文字 AstrBot 插件</title>
  <desc id="desc">一个带有火山、声波、文本卡片和 AstrBot 插件说明的中文项目头图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="0.46" stop-color="#243b55"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="0.42" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#d83a00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 800 50px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 500 22px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .small { font: 500 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .tiny { font: 600 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffedd5; }
      .stroke { stroke: #93c5fd; stroke-width: 6; stroke-linecap: round; fill: none; opacity: 0.95; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="1020" cy="62" r="105" fill="#38bdf8" opacity="0.09"/>
  <circle cx="1015" cy="65" r="64" fill="#f97316" opacity="0.10"/>
  <path d="M0 268 C150 238 264 276 404 244 C542 212 640 244 762 224 C916 198 1048 216 1200 178 L1200 360 L0 360 Z" fill="#07111f" opacity="0.52"/>

  <g transform="translate(64 48)" filter="url(#softShadow)">
    <path d="M80 226 L196 40 L318 226 Z" fill="#334155"/>
    <path d="M196 40 L236 108 L201 95 L168 110 Z" fill="#e2e8f0"/>
    <path d="M112 226 L196 92 L286 226 Z" fill="#1e293b"/>
    <path d="M196 91 C220 124 207 153 223 176 C236 195 254 205 260 226 L166 226 C172 203 189 195 185 171 C181 143 190 118 196 91 Z" fill="url(#lava)"/>
    <ellipse cx="196" cy="48" rx="42" ry="13" fill="#ffedd5" opacity="0.36"/>
    <path d="M160 34 C172 14 198 22 210 5 C216 30 260 24 266 52 C236 40 206 58 160 34 Z" fill="#f97316" opacity="0.85"/>
  </g>

  <g transform="translate(382 58)">
    <text class="title" x="0" y="48">火山语音转文字</text>
    <text class="subtitle" x="3" y="88">把 QQ 语音变成 AstrBot 能理解、能记忆、能继续对话的干净文本</text>
    <g transform="translate(0 123)">
      <rect x="0" y="0" width="182" height="40" rx="20" fill="#f97316" opacity="0.94"/>
      <text class="tiny" x="24" y="26">火山引擎 ASR</text>
      <rect x="196" y="0" width="170" height="40" rx="20" fill="#0284c7" opacity="0.94"/>
      <text class="tiny" x="225" y="26">内置 ffmpeg</text>
      <rect x="380" y="0" width="214" height="40" rx="20" fill="#16a34a" opacity="0.94"/>
      <text class="tiny" x="408" y="26">LivingMemory 友好</text>
    </g>
    <g transform="translate(4 190)" opacity="0.92">
      <path class="stroke" d="M0 25 L28 25"/>
      <path class="stroke" d="M48 25 C58 5 70 5 80 25 C90 45 102 45 112 25"/>
      <path class="stroke" d="M132 25 C144 -4 160 -4 172 25 C184 54 200 54 212 25"/>
      <path class="stroke" d="M232 25 C244 8 258 8 270 25 C282 42 296 42 308 25"/>
      <path class="stroke" d="M328 25 L392 25"/>
    </g>
  </g>

  <g transform="translate(842 96)" filter="url(#softShadow)">
    <rect width="276" height="160" rx="24" fill="url(#glass)" stroke="#dbeafe" stroke-opacity="0.28"/>
    <text class="label" x="26" y="45">语音输入</text>
    <path d="M30 72 H130" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 100 H198" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M30 128 H154" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <g transform="translate(200 48)">
      <circle cx="36" cy="36" r="34" fill="#ffedd5" opacity="0.18"/>
      <path d="M28 20 A8 8 0 0 1 44 20 V47 A8 8 0 0 1 28 47 Z" fill="#f97316"/>
      <path d="M18 39 C18 58 54 58 54 39" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M36 61 V72" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <text class="small" x="70" y="326">Base64 上传 / AMR 与 SILK 转码 / 纯文本注入 / LLM 提示词后置替换</text>
</svg>
