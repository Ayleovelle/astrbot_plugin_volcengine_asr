<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">火山引擎语音转文字 AstrBot 插件</title>
  <desc id="desc">简洁扁平化 README 头图，以火山、波浪线与抽象符号表现声音和文本边界被重新组织的意象。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFBEB"/>
    </linearGradient>
    <style>
      .title { font: 900 56px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #3B1A0A; letter-spacing: 1px; }
      .subtitle { font: 700 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #9A3412; }
      .chip { font: 800 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #7C2D12; }
      .chip-hot { font: 800 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .flow { font: 800 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #7C2D12; }
      .note { font: 700 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #C2410C; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="1074" cy="72" r="132" fill="#FB923C" opacity="0.14"/>
  <circle cx="984" cy="296" r="96" fill="#F97316" opacity="0.10"/>

  <g transform="translate(64 48)">
    <rect width="252" height="252" rx="34" fill="url(#panel)" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="126" cy="126" r="86" fill="#FFEDD5"/>
    <circle cx="126" cy="126" r="104" fill="none" stroke="#FB923C" stroke-width="3" stroke-dasharray="10 12" opacity="0.75"/>

    <path d="M58 172 L126 58 L194 172 Z" fill="#7C2D12"/>
    <path d="M126 58 L153 105 L128 96 L101 108 Z" fill="#FFF7ED"/>
    <path d="M94 172 L126 110 L160 172 Z" fill="#F97316"/>
    <path d="M113 172 L126 134 L140 172 Z" fill="#FDE68A"/>

    <path d="M72 74 C52 54 56 34 84 26" fill="none" stroke="#7C2D12" stroke-width="8" stroke-linecap="round"/>
    <path d="M180 74 C200 54 196 34 168 26" fill="none" stroke="#7C2D12" stroke-width="8" stroke-linecap="round"/>
    <circle cx="126" cy="44" r="9" fill="#EF4444"/>

    <path d="M64 206 H188" stroke="#EA580C" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(370 70)">
    <text class="title" x="0" y="58">VoiceMountain</text>
    <text class="subtitle" x="2" y="100">让文字不再是文字，让语言不再是语言</text>

    <g transform="translate(4 204)">
      <text class="flow" x="0" y="42">Plain Text</text>
      <g transform="translate(198 0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 28 C24 4 48 4 72 28 S120 52 144 28 S192 4 216 28 S264 52 288 28 S336 4 360 28 S408 52 432 28" stroke="#EA580C" stroke-width="8" opacity="0.78"/>
        <path d="M0 28 C24 4 48 4 72 28 S120 52 144 28 S192 4 216 28 S264 52 288 28 S336 4 360 28 S408 52 432 28" stroke="#FFF7ED" stroke-width="3" opacity="0.9"/>
        <circle cx="0" cy="28" r="7" fill="#9A3412" stroke="none"/>
        <circle cx="144" cy="28" r="7" fill="#F97316" stroke="none"/>
        <circle cx="288" cy="28" r="7" fill="#F97316" stroke="none"/>
        <circle cx="432" cy="28" r="7" fill="#9A3412" stroke="none"/>
      </g>
    </g>
  </g>

  <g transform="translate(1016 188)" opacity="0.8">
    <path d="M0 70 L44 0 L88 70 Z" fill="#FDBA74"/>
    <path d="M38 70 L66 24 L94 70 Z" fill="#F97316"/>
    <circle cx="44" cy="98" r="28" fill="none" stroke="#EA580C" stroke-width="4" stroke-dasharray="6 9"/>
  </g>
</svg>
