<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VoiceMountain 火山引擎语音转文字 AstrBot 插件主视觉</title>
  <desc id="desc">原创火山海岛风格主视觉，使用暖橙火山、青绿色海风、黑曜石工业面板和语音波形表现语音转文字链路。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1E2A"/>
      <stop offset="0.42" stop-color="#344154"/>
      <stop offset="0.72" stop-color="#E16A46"/>
      <stop offset="1" stop-color="#F7C978"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54D6C5"/>
      <stop offset="0.52" stop-color="#89E6D4"/>
      <stop offset="1" stop-color="#F7D68B"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A6"/>
      <stop offset="0.42" stop-color="#F9734D"/>
      <stop offset="1" stop-color="#A5242C"/>
    </linearGradient>
    <linearGradient id="emotionLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E87553"/>
      <stop offset="1" stop-color="#F7A15D"/>
    </linearGradient>
    <linearGradient id="obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F3B"/>
      <stop offset="1" stop-color="#10131A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#F2DEC0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96 0 1 0 0 0.43 0 0 1 0 0.22 0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F8E7C8" stroke-width="1" opacity="0.12"/>
    </pattern>
    <style>
      .latin-title { font: 900 61px "Inter", "Arial", sans-serif; fill: #FFF8E8; }
      .cn-title { font: 800 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #FFE3B5; }
      .label { font: 800 14px "Inter", "Arial", sans-serif; fill: #19202B; }
      .chip { font: 800 15px "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .tiny { font: 700 12px "Inter", "Arial", sans-serif; fill: #FBE7C6; }
      .mono { font: 800 13px "Consolas", "JetBrains Mono", monospace; fill: #1B2330; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

