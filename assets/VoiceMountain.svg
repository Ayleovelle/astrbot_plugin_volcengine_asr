<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">火山引擎语音转文字 AstrBot 插件</title>
  <desc id="desc">扁平化简约中文项目头图，以抽象火山、术式环、三角晶石和羊角轮廓表达火山语音识别与艾雅法拉气质。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.56" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.42" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <style>
      .title { font: 900 54px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #431407; letter-spacing: 1px; }
      .subtitle { font: 700 23px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #9a3412; }
      .pill { font: 800 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #fff7ed; }
      .note { font: 700 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #c2410c; }
      .label { font: 900 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #7c2d12; }
      .flow { font: 800 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #7c2d12; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1012" cy="84" r="116" fill="#fb923c" opacity="0.16"/>
  <circle cx="1090" cy="252" r="72" fill="#f97316" opacity="0.10"/>
  <path d="M760 286 C846 230 948 248 1110 170" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 18" opacity="0.32"/>

  <g transform="translate(70 38)">
    <rect x="0" y="0" width="292" height="284" rx="34" fill="#ffffff" opacity="0.74"/>
    <circle cx="146" cy="142" r="104" fill="#ffedd5"/>
    <circle cx="146" cy="142" r="82" fill="none" stroke="#ea580c" stroke-width="6" stroke-dasharray="18 14"/>
    <circle cx="146" cy="142" r="114" fill="none" stroke="#fdba74" stroke-width="3" stroke-dasharray="5 16"/>

    <path d="M65 212 L146 74 L227 212 Z" fill="#7c2d12"/>
    <path d="M146 74 L178 128 L150 118 L121 130 Z" fill="#fff7ed"/>
    <path d="M106 212 L146 124 L189 212 Z" fill="url(#flame)"/>
    <path d="M86 236 C112 214 137 216 162 236 C184 254 209 252 232 232" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>

    <path d="M54 88 C36 56 56 32 84 22 C76 50 101 62 92 90 Z" fill="#fb923c"/>
    <path d="M146 62 C118 22 148 2 181 -14 C169 26 207 42 188 76 Z" fill="#ef4444"/>
    <path d="M236 90 C220 58 238 36 268 24 C258 54 282 66 272 96 Z" fill="#fb923c"/>

    <path d="M86 72 C66 48 44 44 24 58" fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
    <path d="M206 72 C226 48 248 44 268 58" fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
    <path d="M36 40 L54 58 L32 68 Z" fill="#f97316"/>
    <path d="M256 40 L238 58 L260 68 Z" fill="#f97316"/>

    <text class="label" x="72" y="268">火山术式 · 语音净化</text>
  </g>

  <g transform="translate(410 72)">
    <text class="title" x="0" y="54">火山语音转文字</text>
    <text class="subtitle" x="2" y="96">把 QQ 语音炼成 AstrBot 能理解、能记忆的干净文本</text>

    <g transform="translate(2 132)">
      <rect x="0" y="0" width="172" height="42" rx="21" fill="#ea580c"/>
      <text class="pill" x="28" y="27">火山引擎 ASR</text>
      <rect x="190" y="0" width="168" height="42" rx="21" fill="#c2410c"/>
      <text class="pill" x="230" y="27">内置转码</text>
      <rect x="376" y="0" width="214" height="42" rx="21" fill="#9a3412"/>
      <text class="pill" x="406" y="27">LivingMemory 友好</text>
    </g>

    <g transform="translate(2 204)">
      <rect x="0" y="0" width="128" height="44" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text class="flow" x="34" y="28">语音输入</text>
      <path d="M144 22 H188" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
      <path d="M180 14 L194 22 L180 30" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="210" y="0" width="128" height="44" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text class="flow" x="244" y="28">ASR 转写</text>
      <path d="M354 22 H398" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
      <path d="M390 14 L404 22 L390 30" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="420" y="0" width="152" height="44" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text class="flow" x="459" y="28">记忆可读</text>
    </g>
  </g>

  <g transform="translate(980 46)" opacity="0.72">
    <path d="M0 48 L34 0 L68 48 Z" fill="#fed7aa"/>
    <path d="M82 98 L122 38 L162 98 Z" fill="#fdba74"/>
    <path d="M18 154 L54 102 L90 154 Z" fill="#fb923c"/>
  </g>

  <text class="note" x="412" y="316">Base64 上传 · AMR/SILK 转码 · 纯文本注入 · LLM 提示词后置替换</text>
</svg>
