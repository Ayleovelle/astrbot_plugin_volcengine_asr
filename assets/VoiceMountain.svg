<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">火山引擎语音转文字 AstrBot 插件</title>
  <desc id="desc">清爽深色背景的中文项目头图，展示语音转文字、AstrBot 插件和 LivingMemory 友好。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .title { font: 800 54px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 500 23px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .pill { font: 700 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .note { font: 500 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #94a3b8; }
      .cardText { font: 700 19px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #e0f2fe; }
      .flowText { font: 700 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="68" r="142" fill="#38bdf8" opacity="0.07"/>
  <circle cx="112" cy="312" r="124" fill="#fb923c" opacity="0.06"/>

  <g transform="translate(72 58)" filter="url(#shadow)">
    <rect width="250" height="244" rx="30" fill="url(#panel)" stroke="#334155"/>
    <circle cx="125" cy="105" r="70" fill="#111827" stroke="#334155" stroke-width="2"/>
    <path d="M63 157 L125 52 L187 157 Z" fill="#334155"/>
    <path d="M125 52 L148 91 L128 84 L109 92 Z" fill="#e2e8f0"/>
    <path d="M96 157 L125 94 L155 157 Z" fill="url(#accent)"/>
    <path d="M77 192 C96 174 115 174 134 192 C151 208 170 207 189 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <text class="cardText" x="61" y="222">语音 → 干净文本</text>
  </g>

  <g transform="translate(380 70)">
    <text class="title" x="0" y="56">火山语音转文字</text>
    <text class="subtitle" x="2" y="98">让 AstrBot 听懂语音，并把内容稳定交给记忆插件</text>

    <g transform="translate(2 132)">
      <rect x="0" y="0" width="172" height="42" rx="21" fill="#f97316"/>
      <text class="pill" x="28" y="27">火山引擎 ASR</text>
      <rect x="190" y="0" width="168" height="42" rx="21" fill="#0284c7"/>
      <text class="pill" x="230" y="27">内置转码</text>
      <rect x="376" y="0" width="212" height="42" rx="21" fill="#16a34a"/>
      <text class="pill" x="408" y="27">LivingMemory 友好</text>
    </g>

    <g transform="translate(2 206)">
      <rect x="0" y="0" width="128" height="44" rx="14" fill="#1e293b" stroke="#334155"/>
      <text class="flowText" x="34" y="28">语音输入</text>
      <path d="M142 22 H190" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <path d="M182 14 L194 22 L182 30" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="208" y="0" width="128" height="44" rx="14" fill="#1e293b" stroke="#334155"/>
      <text class="flowText" x="242" y="28">ASR 转写</text>
      <path d="M350 22 H398" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <path d="M390 14 L402 22 L390 30" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="416" y="0" width="152" height="44" rx="14" fill="url(#blue)"/>
      <text class="flowText" x="455" y="28">记忆可读</text>
    </g>
  </g>

  <text class="note" x="380" y="314">Base64 上传 · AMR/SILK 转码 · 纯文本注入 · LLM 提示词后置替换</text>
</svg>
