<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">火山引擎语音转文字 AstrBot 插件</title>
  <desc id="desc">前景是火山语音插件信息，后景放置 Fuck-U-Code 评分卡水印。</desc>
  <defs>
    <style>
      .bgTitle { font: 900 52px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #5d4037; letter-spacing: 1px; }
      .bgLabel { font: 800 20px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #5d4037; letter-spacing: 4px; }
      .bgScore { font: 900 56px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #5d4037; letter-spacing: 1px; }
      .brand { font: 800 24px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #7c2d12; letter-spacing: 3px; }
      .title { font: 900 58px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #3f2a1f; letter-spacing: 1px; }
      .subtitle { font: 700 22px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #5d4037; }
      .pill { font: 800 17px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #fff7ed; }
      .note { font: 700 18px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #5d4037; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#e0c9a6"/>

  <g transform="translate(632 44)" opacity="0.28">
    <rect x="0" y="0" width="458" height="258" rx="24" fill="#ffffff"/>
    <text class="bgLabel" x="44" y="58">CODE SMELL BY</text>
    <text class="bgTitle" x="44" y="124">Fuck-U-Code</text>
    <rect x="44" y="158" width="188" height="78" rx="14" fill="#e0c9a6"/>
    <text class="bgLabel" x="70" y="190">SCORE</text>
    <text class="bgScore" x="262" y="218">68.39</text>
    <text class="bgLabel" x="70" y="224">屎气扑鼻</text>
  </g>

  <g transform="translate(74 54)">
    <rect x="0" y="0" width="282" height="252" rx="28" fill="#fff7ed" opacity="0.72"/>
    <path d="M58 194 L141 54 L224 194 Z" fill="#5d4037"/>
    <path d="M141 54 L171 106 L144 96 L118 107 Z" fill="#ffffff"/>
    <path d="M102 194 L141 120 L181 194 Z" fill="#ff6a00"/>
    <path d="M84 222 C105 203 126 203 148 222 C169 240 190 239 211 220" fill="none" stroke="#5d4037" stroke-width="12" stroke-linecap="round"/>
    <path d="M108 34 C128 12 166 16 184 40 C158 31 136 54 108 34 Z" fill="#5d4037" opacity="0.9"/>
  </g>

  <g transform="translate(404 76)">
    <text class="brand" x="0" y="0">VOICE MOUNTAIN</text>
    <text class="title" x="0" y="74">火山语音转文字</text>
    <text class="subtitle" x="4" y="118">让 AstrBot 听懂语音，并把干净文本交给记忆插件</text>

    <g transform="translate(4 154)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#c2410c"/>
      <text class="pill" x="26" y="27">火山 ASR</text>
      <rect x="168" y="0" width="150" height="42" rx="21" fill="#5d4037"/>
      <text class="pill" x="203" y="27">自动转码</text>
      <rect x="336" y="0" width="210" height="42" rx="21" fill="#7c2d12"/>
      <text class="pill" x="366" y="27">LivingMemory 友好</text>
    </g>

    <text class="note" x="4" y="234">语音输入 → ASR 转写 → 纯文本记忆 → 语音化回复</text>
  </g>
