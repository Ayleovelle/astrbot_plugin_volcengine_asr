<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>火山语音控制台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff7ed;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: #ffffff;
      --line: #fed7aa;
      --line-strong: #fb923c;
      --text: #431407;
      --muted: #9a3412;
      --accent: #ea580c;
      --accent-strong: #c2410c;
      --ok: #15803d;
      --danger: #b91c1c;
      --shadow: 0 18px 44px rgba(154, 52, 18, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(251, 146, 60, 0.22), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(234, 88, 12, 0.14), transparent 26%),
        linear-gradient(135deg, #fff7ed 0%, #ffedd5 52%, #fed7aa 100%);
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 22px 0;
      animation: rise 520ms ease both;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      background: var(--accent);
      color: #fff7ed;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    button:hover {
      transform: translateY(-1px);
      background: var(--accent-strong);
      box-shadow: 0 12px 24px rgba(234, 88, 12, 0.20);
    }
    button:disabled {
      cursor: progress;
      opacity: 0.65;
      transform: none;
      box-shadow: none;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .ghost {
      background: #ffedd5;
      color: var(--accent-strong);
    }
    .ghost:hover {
      background: #fed7aa;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin: 8px 0 18px;
    }
    .metric, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .metric {
      padding: 16px;
      animation: rise 520ms ease both;
    }
    .metric:nth-child(2) { animation-delay: 60ms; }
    .metric:nth-child(3) { animation-delay: 120ms; }
    .metric:nth-child(4) { animation-delay: 180ms; }
    .metric .label {
      color: var(--muted);
      font-size: 13px;
    }
    .metric .value {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .tabs {
      position: sticky;
      top: 16px;
      padding: 10px;
      animation: rise 560ms ease both;
    }
    .tab {
      width: 100%;
      justify-content: flex-start;
      margin: 4px 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }
    .tab:hover, .tab.active {
      background: #ffedd5;
      color: var(--accent-strong);
      box-shadow: none;
    }
    .content {
      display: grid;
      gap: 16px;
    }
    .panel {
      overflow: hidden;
      animation: rise 620ms ease both;
    }
    .panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 247, 237, 0.62);
    }
    .panel h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }
    .panel .hint {
      color: var(--muted);
      font-size: 13px;
    }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      padding: 18px 20px 20px;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 850;
      font-size: 14px;
    }
    .key {
      color: var(--muted);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }
    input, select {
      min-height: 40px;
      padding: 0 12px;
    }
    textarea {
      min-height: 132px;
      padding: 12px;
      resize: vertical;
      line-height: 1.55;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 4px rgba(251, 146, 60, 0.16);
      transform: translateY(-1px);
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
    }
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #fdba74;
      transition: background 180ms ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff7ed;
      transition: transform 180ms ease;
      box-shadow: 0 2px 8px rgba(67, 20, 7, 0.25);
    }
    .switch input:checked + .slider {
      background: var(--accent);
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
    .field-hint {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .viz {
      display: grid;
      gap: 16px;
      padding: 18px 20px 20px;
    }
    .workflow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .step {
      position: relative;
      min-height: 82px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      padding: 12px;
      animation: rise 460ms ease both;
    }
    .step::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 50%;
      width: 10px;
      height: 2px;
      background: var(--line-strong);
    }
    .step:last-child::after {
      display: none;
    }
    .step .number {
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
    }
    .step .name {
      margin-top: 6px;
      font-weight: 900;
    }
    .step .desc {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .viz-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
      gap: 16px;
    }
    .viz-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      padding: 16px;
    }
    .viz-card h3 {
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: 0;
    }
    .cloud-wrap {
      position: relative;
      min-height: 330px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.18), rgba(245, 158, 11, 0.18)),
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.86), transparent 50%);
      perspective: 900px;
    }
    .cloud-scene {
      position: absolute;
      inset: 38px 24px 42px;
      transform-style: preserve-3d;
      transform: rotateX(58deg) rotateZ(-32deg);
      animation: cloudFloat 7s ease-in-out infinite alternate;
    }
    .cloud-plane {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(154, 52, 18, 0.20);
      border-radius: 8px;
      background:
        linear-gradient(rgba(154, 52, 18, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(154, 52, 18, 0.12) 1px, transparent 1px);
      background-size: 32px 32px;
      transform: translateZ(-10px);
    }
    .cloud-axis {
      position: absolute;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .axis-negative { left: 16px; bottom: 12px; }
    .axis-positive { right: 16px; bottom: 12px; }
    .axis-arousal { left: 16px; top: 12px; }
    .axis-weight { right: 16px; top: 12px; }
    .cloud-point {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: hsl(var(--hue), 82%, 54%);
      box-shadow:
        0 0 0 5px hsla(var(--hue), 82%, 54%, 0.14),
        0 18px 30px hsla(var(--hue), 82%, 30%, 0.22);
      transform: translate3d(-50%, -50%, var(--z));
      transition: left 360ms ease, top 360ms ease, transform 360ms ease, background 360ms ease;
    }
    .cloud-point::after {
      content: attr(data-label) " " attr(data-weight);
      position: absolute;
      left: 50%;
      top: calc(100% + 6px);
      transform: translateX(-50%) rotateZ(32deg) rotateX(-58deg);
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 247, 237, 0.88);
      color: var(--text);
      white-space: nowrap;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(67, 20, 7, 0.10);
    }
    .cloud-legend {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .color-ramp {
      height: 10px;
      margin-top: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb 0%, #14b8a6 34%, #facc15 68%, #f97316 100%);
    }
    .formula {
      display: grid;
      gap: 10px;
    }
    .formula-line {
      border-left: 4px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(255, 237, 213, 0.62);
      padding: 10px 12px;
    }
    .formula-line code {
      font-family: "JetBrains Mono", Consolas, monospace;
      color: var(--accent-strong);
      font-weight: 800;
      white-space: normal;
    }
    .knobs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }
    .knob {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }
    .knob input {
      accent-color: var(--accent);
    }
    .score {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .score-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 247, 237, 0.72);
    }
    .score-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .score-box strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }
    .refs {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }
    .refs a {
      color: var(--accent-strong);
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: 360px;
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--text);
      color: #fff7ed;
      box-shadow: var(--shadow);
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.ok { background: var(--ok); }
    .toast.error { background: var(--danger); }
    .fade {
      opacity: 0.35;
      transform: translateY(4px);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cloudFloat {
      from { transform: rotateX(58deg) rotateZ(-32deg) translateZ(0); }
      to { transform: rotateX(58deg) rotateZ(-26deg) translateZ(8px); }
    }
    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }
      .hero {
        grid-template-columns: 1fr;
      }
      .toolbar {
        justify-content: stretch;
      }
      .toolbar button {
        flex: 1;
      }
      .layout {
        grid-template-columns: 1fr;
      }
      .tabs {
        position: static;
        display: flex;
        overflow-x: auto;
      }
      .tab {
        white-space: nowrap;
      }
      .viz-grid {
        grid-template-columns: 1fr;
      }
      .step::after {
        display: none;
      }
      .cloud-wrap {
        min-height: 290px;
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c0f08;
        --surface: rgba(67, 20, 7, 0.82);
        --surface-strong: #2b1509;
        --line: #9a3412;
        --line-strong: #fb923c;
        --text: #ffedd5;
        --muted: #fdba74;
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.26);
      }
      body {
        background:
          radial-gradient(circle at 12% 8%, rgba(251, 146, 60, 0.18), transparent 28%),
          radial-gradient(circle at 82% 18%, rgba(234, 88, 12, 0.18), transparent 26%),
          linear-gradient(135deg, #1c0f08 0%, #2b1509 62%, #431407 100%);
      }
      .ghost, .tab:hover, .tab.active {
        background: rgba(253, 186, 116, 0.15);
      }
      .panel header {
        background: rgba(67, 20, 7, 0.65);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <h1>火山语音控制台</h1>
        <p>查看 ASR、转码、情绪判断与 LivingMemory 状态，并直接调整插件配置。保存后配置会写回 AstrBot 插件配置。</p>
      </div>
      <div class="toolbar">
        <button class="ghost" id="reload">刷新</button>
        <button id="save">保存配置</button>
      </div>
    </section>

    <section class="status-grid">
      <div class="metric"><div class="label">鉴权</div><div class="value" id="auth_configured">读取中</div></div>
      <div class="metric"><div class="label">提交模式</div><div class="value" id="submit_mode">读取中</div></div>
      <div class="metric"><div class="label">转码</div><div class="value" id="enable_transcode">读取中</div></div>
      <div class="metric"><div class="label">情绪判断</div><div class="value" id="emotion_enabled">读取中</div></div>
    </section>

    <section class="layout">
      <nav class="tabs panel" id="tabs"></nav>
      <section class="content" id="content"></section>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const groups = [
      { id: 'auth', title: '鉴权与接口', keys: ['api_key', 'app_key', 'access_key', 'resource_id', 'endpoint', 'uid'] },
      { id: 'audio', title: '音频与转码', keys: ['submit_mode', 'max_audio_mb', 'timeout_seconds', 'enable_transcode', 'prefer_bundled_ffmpeg', 'ffmpeg_path', 'transcode_output_format', 'transcode_sample_rate', 'transcode_channels'] },
      { id: 'recognition', title: '识别参数', keys: ['enable_itn', 'enable_punc', 'enable_ddc', 'enable_speaker_info'] },
      { id: 'inject', title: '注入与回复', keys: ['auto_recognize', 'inject_as_user_input', 'voice_prompt_template', 'inject_on_unclear_voice', 'unclear_voice_prompt', 'reply_transcription', 'reply_template', 'stop_event_after_recognition', 'send_empty_result_message'] },
      { id: 'scope', title: '触发与排查', keys: ['enable_private', 'enable_group', 'only_when_at_or_wake', 'ignore_self', 'notify_config_error', 'notify_asr_error', 'show_logid'] },
      { id: 'emotion', title: '情绪判断', keys: ['enable_emotion_analysis', 'emotion_model_id', 'emotion_context_turns', 'emotion_max_respect_weight_percent', 'emotion_timeout_seconds', 'emotion_fail_open', 'emotion_prompt_template'] },
      { id: 'model', title: '模型可视化', keys: [] }
    ];

    let fields = [];
    let activeGroup = groups[0].id;
    let saving = false;
    const sample = {
      transcriptChars: 42,
      confidence: 0.71,
      voiceTextSupport: 0.75,
      contextSupport: 0.40,
      weights: {
        anxious: 0.62,
        sad: 0.18,
        neutral: 0.12,
        confused: 0.08,
        happy: 0.10,
        excited: 0.06
      }
    };
    const emotionCoordinates = {
      angry: { valence: -0.82, arousal: 0.82 },
      anxious: { valence: -0.64, arousal: 0.74 },
      frustrated: { valence: -0.72, arousal: 0.60 },
      sad: { valence: -0.78, arousal: 0.30 },
      tired: { valence: -0.48, arousal: 0.18 },
      confused: { valence: -0.18, arousal: 0.52 },
      neutral: { valence: 0.00, arousal: 0.28 },
      happy: { valence: 0.72, arousal: 0.52 },
      excited: { valence: 0.82, arousal: 0.86 }
    };

    const $ = (id) => document.getElementById(id);
    const yesNo = (value) => value ? '启用' : '关闭';
    const configured = (value) => value ? '已配置' : '未配置';

    async function apiGet(path) {
      const bridge = window.AstrBotPluginPage;
      if (bridge && typeof bridge.apiGet === 'function') {
        if (typeof bridge.ready === 'function') await bridge.ready();
        return bridge.apiGet(path);
      }
      return fetch(`/api/plug/astrbot_plugin_volcengine_asr/${path}`).then((response) => response.json());
    }

    async function apiPost(path, body) {
      const bridge = window.AstrBotPluginPage;
      if (bridge && typeof bridge.apiPost === 'function') {
        if (typeof bridge.ready === 'function') await bridge.ready();
        return bridge.apiPost(path, body);
      }
      return fetch(`/api/plug/astrbot_plugin_volcengine_asr/${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then((response) => response.json());
    }

    function setText(id, value) {
      const node = $(id);
      if (node) node.textContent = value;
    }

    function showToast(message, type = 'ok') {
      const toast = $('toast');
      toast.className = `toast ${type} show`;
      toast.textContent = message;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function renderStatus(status) {
      setText('auth_configured', configured(status.auth_configured));
      setText('submit_mode', status.submit_mode || '-');
      setText('enable_transcode', yesNo(status.enable_transcode));
      setText('emotion_enabled', yesNo(status.emotion && status.emotion.enabled));
    }

    function renderTabs() {
      $('tabs').innerHTML = groups.map((group) => (
        `<button class="tab ${group.id === activeGroup ? 'active' : ''}" data-tab="${group.id}">${group.title}</button>`
      )).join('');
      document.querySelectorAll('.tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          activeGroup = tab.dataset.tab;
          renderTabs();
          renderFields(true);
        });
      });
    }

    function inputHtml(field) {
      const value = field.value ?? field.default ?? '';
      if (field.type === 'bool') {
        return `
          <div class="switch-row">
            <span>${value ? '启用' : '关闭'}</span>
            <label class="switch">
              <input data-key="${field.key}" type="checkbox" ${value ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
          </div>
        `;
      }
      if (field.options && field.options.length) {
        return `
          <select data-key="${field.key}">
            ${field.options.map((option) => `<option value="${escapeAttr(option)}" ${String(option) === String(value) ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
          </select>
        `;
      }
      if (String(value).length > 90 || field.key.endsWith('_template')) {
        return `<textarea data-key="${field.key}">${escapeHtml(value)}</textarea>`;
      }
      const inputType = field.type === 'int' || field.type === 'float' ? 'number' : 'text';
      return `<input data-key="${field.key}" type="${inputType}" value="${escapeAttr(value)}">`;
    }

    function renderFields(animated = false) {
      const group = groups.find((item) => item.id === activeGroup) || groups[0];
      if (group.id === 'model') {
        renderModel(animated);
        return;
      }
      const selected = fields.filter((field) => group.keys.includes(field.key));
      const content = $('content');
      if (animated) content.classList.add('fade');
      window.setTimeout(() => {
        content.innerHTML = `
          <article class="panel">
            <header>
              <div>
                <h2>${group.title}</h2>
                <div class="hint">${selected.length} 个配置项</div>
              </div>
            </header>
            <div class="fields">
              ${selected.map((field) => `
                <div class="field">
                  <label><span>${escapeHtml(field.description || field.key)}</span><span class="key">${field.key}</span></label>
                  ${inputHtml(field)}
                  <div class="field-hint">${escapeHtml(field.hint || '')}</div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
        bindSwitchLabels();
        content.classList.remove('fade');
      }, animated ? 150 : 0);
    }

    function renderModel(animated = false) {
      const content = $('content');
      if (animated) content.classList.add('fade');
      window.setTimeout(() => {
        const maxWeightField = fields.find((field) => field.key === 'emotion_max_respect_weight_percent');
        const maxWeight = Number(maxWeightField && maxWeightField.value ? maxWeightField.value : 60) / 100;
        const values = computeEmotionModel(maxWeight);
        content.innerHTML = `
          <article class="panel">
            <header>
              <div>
                <h2>情绪判断工作流</h2>
                <div class="hint">从 ASR 文本到主 LLM 语气参考权重的可视化</div>
              </div>
            </header>
            <div class="viz">
              <div class="workflow">
                ${[
                  ['01', 'ASR 转写', '得到纯文本，不写入情绪标签'],
                  ['02', '情绪 LLM', '只输出 JSON 情绪分布和证据'],
                  ['03', '归一化', '裁剪权重并计算 Shannon entropy'],
                  ['04', '证据强度', '文本证据 0.7 + 上下文 0.3'],
                  ['05', '参考权重', '把结果限制在最大权重内'],
                  ['06', '主 LLM', '只按权重调整语气，不污染记忆']
                ].map((step) => `
                  <div class="step">
                    <div class="number">${step[0]}</div>
                    <div class="name">${step[1]}</div>
                    <div class="desc">${step[2]}</div>
                  </div>
                `).join('')}
              </div>

              <div class="viz-grid">
                <div class="viz-card">
                  <h3>三维情绪云图</h3>
                  <div class="cloud-wrap">
                    <span class="cloud-axis axis-negative">负面</span>
                    <span class="cloud-axis axis-positive">正面</span>
                    <span class="cloud-axis axis-arousal">唤醒度</span>
                    <span class="cloud-axis axis-weight">权重高度</span>
                    <div class="cloud-scene">
                      <div class="cloud-plane"></div>
                      ${cloudPointsHtml()}
                    </div>
                  </div>
                  <div class="color-ramp"></div>
                  <div class="cloud-legend">
                    <span>横向：负面 → 正面情绪效价</span>
                    <span>纵向：唤醒度</span>
                    <span>高度/大小：情绪权重</span>
                  </div>
                </div>

                <div class="viz-card">
                  <h3>计算结果</h3>
                  <div class="score">
                    <div class="score-box"><span>certainty</span><strong id="certaintyValue">${values.certainty.toFixed(3)}</strong></div>
                    <div class="score-box"><span>evidence</span><strong id="evidenceValue">${values.evidence.toFixed(3)}</strong></div>
                    <div class="score-box"><span>respect_weight</span><strong id="respectWeightValue">${values.respectWeight.toFixed(3)}</strong></div>
                  </div>
                </div>
              </div>

              <div class="viz-card">
                <h3>参数示例</h3>
                <div class="knobs">
                  ${[
                    ['transcriptChars', '文本长度', 1, 120, sample.transcriptChars],
                    ['confidence', 'LLM 置信度', 0, 1, sample.confidence],
                    ['voiceTextSupport', '文本支持度', 0, 1, sample.voiceTextSupport],
                    ['contextSupport', '上下文支持度', 0, 1, sample.contextSupport]
                  ].map((item) => `
                    <label class="knob">
                      <span>${item[1]}：<strong id="${item[0]}Value">${item[4]}</strong></span>
                      <input data-model="${item[0]}" type="range" min="${item[2]}" max="${item[3]}" step="${item[2] === 0 ? 0.01 : 1}" value="${item[4]}">
                    </label>
                  `).join('')}
                </div>
              </div>

              <div class="viz-card">
                <h3>公式展开</h3>
                <div class="formula">
                  <div class="formula-line"><code>H(p) = -Σ p_i log(p_i)</code></div>
                  <div class="formula-line"><code>certainty = 1 - H(p) / log(N) = <span id="certaintyFormula">${values.certainty.toFixed(3)}</span></code></div>
                  <div class="formula-line"><code>evidence = length_factor * (0.7 * voice_text_support + 0.3 * context_support) = <span id="evidenceFormula">${values.evidence.toFixed(3)}</span></code></div>
                  <div class="formula-line"><code>respect_weight = clamp(max_weight * (0.50 * confidence + 0.30 * certainty + 0.20 * evidence)) = <span id="respectWeightFormula">${values.respectWeight.toFixed(3)}</span></code></div>
                </div>
              </div>

              <div class="viz-card">
                <h3>文献依据</h3>
                <ol class="refs">
                  <li><a href="https://doi.org/10.1037/h0077714" target="_blank" rel="noreferrer">Russell, 1980</a>：valence / arousal 二维情绪空间。</li>
                  <li><a href="https://doi.org/10.1017/S0954579405050340" target="_blank" rel="noreferrer">Posner, Russell & Peterson, 2005</a>：环状情绪模型综述。</li>
                  <li><a href="https://doi.org/10.1002/j.1538-7305.1948.tb01338.x" target="_blank" rel="noreferrer">Shannon, 1948</a>：entropy 不确定性度量。</li>
                  <li><a href="https://doi.org/10.1037/0022-3514.48.4.813" target="_blank" rel="noreferrer">Smith & Ellsworth, 1985</a>：认知评价与语境证据。</li>
                  <li><a href="https://arxiv.org/abs/1706.04599" target="_blank" rel="noreferrer">Guo et al., 2017</a>：现代神经网络置信度校准。</li>
                </ol>
              </div>
            </div>
          </article>
        `;
        bindModelKnobs(maxWeight);
        content.classList.remove('fade');
      }, animated ? 150 : 0);
    }

    function computeEmotionModel(maxRespectWeight) {
      const weights = Object.values(sample.weights).filter((weight) => weight > 0);
      const total = weights.reduce((sum, weight) => sum + weight, 0);
      const probabilities = weights.map((weight) => weight / total);
      const entropy = probabilities.reduce((sum, probability) => sum - probability * Math.log(probability), 0);
      const certainty = probabilities.length <= 1 ? 1 : clamp(1 - entropy / Math.log(probabilities.length), 0, 1);
      const lengthFactor = Math.min(1, Math.log(1 + Math.max(0, sample.transcriptChars)) / Math.log(81));
      const evidence = lengthFactor * (0.7 * sample.voiceTextSupport + 0.3 * sample.contextSupport);
      let respectWeight = maxRespectWeight * (0.50 * sample.confidence + 0.30 * certainty + 0.20 * evidence);
      if (sample.transcriptChars < 12) respectWeight = Math.min(respectWeight, 0.25);
      return {
        certainty,
        evidence,
        respectWeight: clamp(respectWeight, 0, maxRespectWeight)
      };
    }

    function cloudPointsHtml() {
      return Object.entries(sample.weights).map(([label, weight]) => {
        const point = emotionCoordinates[label] || { valence: 0, arousal: 0.5 };
        const x = 8 + ((point.valence + 1) / 2) * 84;
        const y = 88 - point.arousal * 76;
        const z = 8 + weight * 92;
        const size = 13 + weight * 30;
        const hue = 220 - ((point.valence + 1) / 2) * 190;
        return `
          <span
            class="cloud-point"
            data-label="${escapeAttr(label)}"
            data-weight="${weight.toFixed(2)}"
            style="--x:${x.toFixed(1)}%; --y:${y.toFixed(1)}%; --z:${z.toFixed(1)}px; --size:${size.toFixed(1)}px; --hue:${hue.toFixed(0)}"
          ></span>
        `;
      }).join('');
    }

    function bindModelKnobs(maxWeight) {
      document.querySelectorAll('[data-model]').forEach((input) => {
        input.addEventListener('input', () => {
          sample[input.dataset.model] = Number(input.value);
          updateModelValues(maxWeight);
        });
      });
      updateModelValues(maxWeight);
    }

    function updateModelValues(maxWeight) {
      const values = computeEmotionModel(maxWeight);
      Object.entries({
        transcriptCharsValue: sample.transcriptChars,
        confidenceValue: sample.confidence.toFixed(2),
        voiceTextSupportValue: sample.voiceTextSupport.toFixed(2),
        contextSupportValue: sample.contextSupport.toFixed(2),
        certaintyValue: values.certainty.toFixed(3),
        evidenceValue: values.evidence.toFixed(3),
        respectWeightValue: values.respectWeight.toFixed(3),
        certaintyFormula: values.certainty.toFixed(3),
        evidenceFormula: values.evidence.toFixed(3),
        respectWeightFormula: values.respectWeight.toFixed(3)
      }).forEach(([id, value]) => setText(id, value));
    }

    function bindSwitchLabels() {
      document.querySelectorAll('input[type="checkbox"][data-key]').forEach((input) => {
        input.addEventListener('change', () => {
          const row = input.closest('.switch-row');
          const label = row && row.querySelector('span');
          if (label) label.textContent = input.checked ? '启用' : '关闭';
        });
      });
    }

    function collectValues() {
      const values = {};
      document.querySelectorAll('[data-key]').forEach((node) => {
        const key = node.dataset.key;
        if (!key) return;
        if (node.type === 'checkbox') {
          values[key] = node.checked;
        } else if (node.type === 'number') {
          values[key] = node.value === '' ? '' : Number(node.value);
        } else {
          values[key] = node.value;
        }
      });
      return values;
    }

    async function load() {
      try {
        const data = await apiGet('config');
        fields = data.config || [];
        renderStatus(data.status || {});
        renderTabs();
        renderFields(false);
      } catch (error) {
        showToast(`读取失败：${error && error.message ? error.message : error}`, 'error');
      }
    }

    async function save() {
      if (saving) return;
      saving = true;
      $('save').disabled = true;
      try {
        const data = await apiPost('config', { values: collectValues() });
        if (!data.ok) throw new Error(data.error || '保存失败');
        fields = data.config || fields;
        renderStatus(data.status || {});
        renderFields(false);
        showToast(data.message || '配置已保存');
      } catch (error) {
        showToast(`保存失败：${error && error.message ? error.message : error}`, 'error');
      } finally {
        saving = false;
        $('save').disabled = false;
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }

    $('reload').addEventListener('click', load);
    $('save').addEventListener('click', save);
    load();
  </script>
</body>
</html>
